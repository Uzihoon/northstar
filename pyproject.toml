[project]
name = "northstar"
version = "0.1.0"
description = "A local-first AI travel planner with Python, open-source LLMs, RAG, and tool-using agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.18.4",
  "pgvector>=0.3,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0"
]

[project.scripts]
northstar = "northstar.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
